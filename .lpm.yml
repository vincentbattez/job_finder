# The lpm config versioned with the repo. The worker runs the queued jobs, one Claude session at a
# time, in its own process: restarting the front never stops a session (ADR-0003).
services:
  # The front, without authentication: reachable on the LAN and through WireGuard, never from
  # internet (ADR-0002)
  web:
    cmd: mise run web
    port: 5180
    portConflict: free
    dependsOn:
      - worker
  worker: mise run worker
jobs:
  # The daily Detection (ADR-0003). Run in a login shell from the repo root, where mise puts `jf` on
  # the PATH. Its output is the run's: « aucune nouvelle Offre » or the new Postings. A failed
  # Detection exits non-zero, and lpm marks the run in error and notifies.
  detect:
    label: Detection
    emoji: 🔎
    schedule:
      at: '18:00'
    duplicate: false
    run:
      cmd: jf detect
