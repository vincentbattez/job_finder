[settings]
experimental = true # required for [hooks]

[tools]
node = "26"
lefthook = "2"
gitleaks = "8"

[env]
_.path = ["{{config_root}}/bin", "{{config_root}}/node_modules/.bin"]
# No Prisma telemetry nor update check
CHECKPOINT_DISABLE = "1"

[hooks]
postinstall = "npm install && lefthook install"

[tasks.init]
description = "Seed dev-data/; the Candidates of data/ are created from the front"
run = "mise run db:seed"

# The db: tasks work on dev-data/, fake data for development. The app migrates data/ itself at launch.
[tasks."db:migrate"]
description = "Create a migration from prisma/schema.prisma and apply it to dev-data/"
run = "mkdir -p dev-data && prisma migrate dev"

[tasks."db:seed"]
description = "Replace the Offres of dev-data/ with fake ones (faker)"
run = "prisma db seed"

[tasks."db:reset"]
description = "Recreate the dev-data/ database from the migrations, then seed it"
run = ["mkdir -p dev-data && prisma migrate reset --force", "mise run db:seed"]

[tasks."db:generate"]
description = "Generate the Prisma client of prisma/schema.prisma into src/workspace/generated (out of git)"
run = "prisma generate"
# Skipped while the client is newer than the schema and the Prisma version: lpm starts web and worker
# together, and two prisma generate emptying the same folder at once left a half-written client
sources = ["prisma/schema.prisma", "prisma.config.ts", "package-lock.json"]
outputs = ["src/workspace/generated/client.ts"]

[tasks.web]
# Regenerate first: a client older than the schema crashes at the first query
depends = ["db:generate"]
description = "Serve the front of data/ on port 5180, open to the LAN and WireGuard: the lpm service web (ADR-0002)"
run = "node node_modules/@react-router/dev/bin.cjs dev --host --port 5180 --strictPort"

[tasks."web:dev"]
# Regenerate first: a client older than the schema crashes at the first query
depends = ["db:generate"]
description = "Serve the front of dev-data/, the fake Offres of development, on port 5181 of this machine only"
# The Notification Channels saved in dev-data/, never those of data/: no real phone gets notified
env = { JF_DATA_DIRECTORY = "dev-data" }
run = "node node_modules/@react-router/dev/bin.cjs dev --port 5181 --strictPort"

[tasks.worker]
# Regenerate first: a client older than the schema crashes at the first query
depends = ["db:generate"]
description = "Run the queued jobs of data/, one Claude session at a time: the lpm service worker (ADR-0003)"
run = "node src/worker/worker.ts"

[tasks."lint:ts"]
description = "Lint with ESLint"
run = "eslint ."

[tasks."lint:format"]
description = "Check formatting with Prettier and prisma format"
run = "prettier --check . && prisma format --check"

[tasks."lint:dead-code"]
description = "Find unused files, exports and dependencies with Knip"
run = "knip"

[tasks."lint:migrations"]
description = "Check that prisma/migrations matches prisma/schema.prisma"
run = "prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code"

[tasks.lint]
description = "Run all linters"
depends = ["lint:ts", "lint:format", "lint:dead-code", "lint:migrations"]

[tasks.typecheck]
description = "Type-check with TypeScript"
run = "tsc"

[tasks."test:unit"]
description = "Run the Vitest suite (actions and architecture)"
run = "vitest run"

[tasks."test:e2e"]
description = "Run the Playwright end-to-end tests"
run = "playwright test --pass-with-no-tests"

[tasks.test]
description = "Run all tests"
depends = ["test:unit", "test:e2e"]

[tasks.ci]
description = "Full CI pipeline locally"
depends = ["lint", "typecheck", "test"]
