name: Setup
description: Node through mise, then the npm dependencies from the npm cache

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v5
    - uses: actions/cache@v6
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: npm-${{ runner.os }}-
    - run: npm ci
      shell: bash
