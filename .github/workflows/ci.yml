name: CI

# A push to a PR branch runs once, as the pull_request: running it as a push too doubled every run
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels the run it makes obsolete; main runs to the end
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_ENABLE_TOOLS: node
  # The postinstall hook reinstalls node_modules on every mise install; in CI, npm ci does it
  MISE_NO_HOOKS: 1

# Three jobs side by side: the run lasts as long as the slowest, the end-to-end tests
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint
        run: mise run lint
      - name: Typecheck
        run: mise run typecheck
      - name: Seed
        run: mise run db:seed

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Vitest
        run: mise run test:unit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The browser only changes with @playwright/test: keyed on its version, the cache survives
      # a lockfile change that leaves Playwright alone
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(jq -r .version node_modules/@playwright/test/package.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Headless, the tests only need Chromium's headless shell, not the full browser. No --with-deps:
      # the runner already has every shared library, apt would only add fallback fonts (#111)
      - name: Install Playwright browsers
        run: npx playwright install --only-shell chromium
      - name: Playwright
        run: mise run test:e2e
      # The page snapshot and the trace of each failed test, to read a failure the log does not explain
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
