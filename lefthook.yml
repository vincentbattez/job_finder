pre-commit:
  parallel: true
  jobs:
    - name: fix
      group:
        piped: true
        jobs:
          - name: lint
            glob: '*.ts'
            run: npx eslint --fix {staged_files}
          - name: format
            run: npx prettier --write --ignore-unknown {staged_files}
          - name: schema
            glob: '*.prisma'
            run: npx prisma format
      stage_fixed: true
    # Everything in English; French only in the fr catalogue and the copy of the modules
    - name: spelling
      run: scripts/spellcheck.sh {staged_files}
    - name: typecheck
      run: npx tsc
    - name: dead-code
      run: npx knip
    - name: secrets
      run: mise exec -- gitleaks git --staged --no-banner --redact -v .

commit-msg:
  jobs:
    - name: commitlint
      run: npx commitlint --edit {1}

# A checkout without node_modules, such as a new git worktree, runs the setup of mise.toml first:
# every hook needs it, and mise's enter hook never fires in an agent's shell, which mise does not
# activate. The Prisma client (src/workspace/generated) is out of git: regenerate it whenever the
# checkout moves, so a pull that changes prisma/schema.prisma never leaves it stale.
post-merge: &setup
  piped: true
  jobs:
    - name: install
      run: test -d node_modules || mise install
    - name: prisma-generate
      # Through mise, which records the fresh client: web and worker then skip it instead of racing
      run: mise run db:generate
post-checkout: *setup
post-rewrite: *setup
